<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Mantena Solar</title>
<style>:root{--lar:#f97316;--lar2:#fb923c;--amb:#f59e0b;--ver:#10b981;--azu:#3b82f6;--rox:#8b5cf6;--verm:#ef4444;--tinta:#0f172a;--tinta2:#1e293b;--cz:#64748b;--cz2:#94a3b8;--linha:#e2e8f0;--fundo:#f1f5f9;--branco:#fff;--sombra:0 1px 3px rgba(15,23,42,.06),0 8px 24px -8px rgba(15,23,42,.12);--sombra2:0 20px 50px -12px rgba(15,23,42,.35);--r:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--fundo);color:var(--tinta);min-height:100vh;padding-bottom:86px;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
#login{position:fixed;top:0;left:0;right:0;bottom:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0f172a 0%,#1e293b 60%,#0f172a 100%)}
#login::before{content:'';position:absolute;top:-120px;right:-100px;width:320px;height:320px;background:radial-gradient(circle,rgba(249,115,22,.35),transparent 70%);filter:blur(20px)}
.login-card{position:relative;background:var(--branco);border-radius:24px;padding:30px 22px;width:100%;max-width:400px;box-shadow:var(--sombra2)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-ico{width:44px;height:44px;border-radius:13px;flex:0 0 44px;background:linear-gradient(135deg,var(--lar),var(--amb));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -4px rgba(249,115,22,.5)}
.brand-txt{font-size:19px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.brand-txt small{display:block;font-size:10px;font-weight:600;color:var(--cz2);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.login-card h2{font-size:21px;letter-spacing:-.6px;margin-bottom:4px}
.login-card .sub{font-size:13px;color:var(--cz);margin-bottom:20px;line-height:1.5}
.f{margin-bottom:13px}
.f label{display:block;font-size:10.5px;font-weight:800;color:var(--cz);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:13px;border:2px solid var(--linha);border-radius:12px;font-size:16px;background:#f8fafc;color:var(--tinta);transition:.15s}
.f textarea{min-height:64px;resize:vertical;font-size:15px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--lar);outline:none;background:#fff;box-shadow:0 0 0 4px rgba(249,115,22,.12)}
.f .hint{font-size:11px;color:var(--cz2);margin-top:4px;line-height:1.4}
.req{color:var(--verm)}
.row{display:flex;gap:9px}.row>.f{flex:1;min-width:0}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:15.5px;font-weight:800;cursor:pointer;transition:.15s;letter-spacing:-.2px}
.btn:active{transform:scale(.98)}
.btn-p{background:linear-gradient(135deg,var(--lar),var(--lar2));color:#fff;box-shadow:0 8px 20px -6px rgba(249,115,22,.6)}
.btn-s{background:#eef2f7;color:#334155}
.alerta{padding:12px 13px;border-radius:11px;font-size:12.5px;margin-bottom:13px;display:none;line-height:1.5;font-weight:600}
.alerta.err{background:#fef2f2;color:#b91c1c;border-left:3px solid var(--verm)}
.alerta.warn{background:#fffbeb;color:#b45309;border-left:3px solid var(--amb)}
#app{display:none}
.topo{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:14px 16px 16px;border-radius:0 0 20px 20px;box-shadow:0 8px 28px -10px rgba(15,23,42,.5)}
.topo-l1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.topo-user{display:flex;align-items:center;gap:9px;min-width:0}
.avatar{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--lar),var(--amb))}
.topo-nome{font-size:14.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-perfil{font-size:10.5px;color:#94a3b8;margin-top:1px}
.topo-btns{display:flex;gap:6px;flex:0 0 auto}
.ico-btn{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
.ico-btn:active{background:rgba(255,255,255,.26)}
.resumo-topo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.rt{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 11px;border:1px solid rgba(255,255,255,.08)}
.rt .n{font-size:20px;font-weight:800;letter-spacing:-.8px;line-height:1}
.rt .l{font-size:9.5px;color:#94a3b8;margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.rt.al .n{color:#fca5a5}.rt.ok .n{color:#6ee7b7}
.abas{display:flex;gap:6px;padding:12px 12px 0;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{flex:0 0 auto;padding:9px 14px;border-radius:10px;cursor:pointer;background:var(--branco);color:var(--cz);font-size:12.5px;font-weight:700;border:1.5px solid var(--linha);transition:.15s;white-space:nowrap}
.aba.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.aba .badge{display:inline-block;background:rgba(0,0,0,.1);padding:1px 6px;border-radius:20px;font-size:10px;margin-left:4px}
.aba.on .badge{background:rgba(255,255,255,.22)}
.painel{padding:12px}
.tela{display:none}.tela.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sec-tit{display:flex;align-items:center;justify-content:space-between;margin:16px 0 9px;gap:10px}
.sec-tit h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--cz);font-weight:800}
.sec-tit .n{font-size:11px;color:var(--cz2);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--branco);border-radius:var(--r);padding:13px;box-shadow:var(--sombra);border:1px solid var(--linha)}
.kpi .l{font-size:9.5px;font-weight:800;color:var(--cz2);text-transform:uppercase;letter-spacing:.4px}
.kpi .n{font-size:25px;font-weight:800;letter-spacing:-1.2px;margin-top:4px;line-height:1}
.kpi .d{font-size:10.5px;color:var(--cz2);margin-top:3px}
.kpi.al{border-color:#fecaca;background:#fff5f5}.kpi.al .n{color:var(--verm)}
.kpi.ok .n{color:var(--ver)}
.card{background:var(--branco);border-radius:var(--r);padding:15px;box-shadow:var(--sombra);border:1px solid var(--linha);margin-top:11px}
.barra{display:flex;gap:3px;height:30px;border-radius:9px;overflow:hidden;margin:4px 0 11px}
.barra>div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;min-width:22px;transition:.2s}
.leg{display:flex;flex-wrap:wrap;gap:9px}
.leg>div{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--cz)}
.dot{width:8px;height:8px;border-radius:3px;flex:0 0 8px}

/* ---------- FILTROS ---------- */
.filtros{background:var(--branco);border-radius:var(--r);padding:12px;box-shadow:var(--sombra);border:1px solid var(--linha);margin-bottom:11px}
.busca{position:relative;margin-bottom:9px}
.busca input{width:100%;padding:12px 38px 12px 38px;border:1.5px solid var(--linha);border-radius:11px;font-size:15px;background:#f8fafc}
.busca input:focus{outline:none;border-color:var(--lar);background:#fff}
.busca .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.45;pointer-events:none}
.busca .limpar{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#e2e8f0;color:#475569;width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.filtros-l2{display:flex;gap:7px}
.filtros-l2 select{flex:1;min-width:0;padding:10px 8px;border:1.5px solid var(--linha);border-radius:10px;font-size:12.5px;font-weight:700;background:#f8fafc;color:#334155;cursor:pointer}
.filtros-l2 select:focus{outline:none;border-color:var(--lar)}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-top:9px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:20px;border:1.5px solid var(--linha);background:#fff;color:var(--cz);font-size:11.5px;font-weight:800;cursor:pointer;transition:.13s;white-space:nowrap}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip .b{display:inline-block;background:rgba(0,0,0,.09);padding:0 5px;border-radius:20px;font-size:10px;margin-left:4px}
.chip.on .b{background:rgba(255,255,255,.24)}
.resultado{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 9px;font-size:11.5px;color:var(--cz);font-weight:700}
.resultado b{color:var(--tinta)}
.resultado .zerar{border:none;background:none;color:var(--lar);font-size:11.5px;font-weight:800;cursor:pointer;padding:3px 0;text-decoration:underline}

/* ---------- CARD DO LEAD ---------- */
.lead{background:var(--branco);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:var(--sombra);border:1px solid var(--linha);border-left:4px solid var(--linha);transition:.13s;position:relative;cursor:pointer}
.lead:active{transform:scale(.995);background:#fcfdfe}
.lead.v-visita{border-left-color:var(--azu)}
.lead.v-orcamento{border-left-color:var(--amb)}
.lead.v-negociacao{border-left-color:var(--rox)}
.lead.v-ganho{border-left-color:var(--ver)}
.lead.v-perdido{border-left-color:var(--verm);opacity:.72}
.lead.atras{background:#fffbfb;border-color:#fecaca}
.lead-l1{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.lead-nome{font-size:15.5px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.lead-meta{font-size:11px;color:var(--cz2);margin-top:3px}
.tag{font-size:9px;font-weight:800;padding:4px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;flex:0 0 auto}
.t-visita{background:#dbeafe;color:#1d4ed8}.t-orcamento{background:#fef3c7;color:#b45309}
.t-negociacao{background:#ede9fe;color:#6d28d9}.t-ganho{background:#d1fae5;color:#047857}
.t-perdido{background:#fee2e2;color:#b91c1c}
.lead-info{display:flex;flex-wrap:wrap;gap:5px 11px;font-size:11px;color:#475569;margin-top:8px}
.lead-prox{margin-top:9px;padding:8px 10px;border-radius:9px;font-size:11.5px;background:#eff6ff;color:#1d4ed8;border-left:2px solid var(--azu);line-height:1.4}
.lead-prox.sem{background:#fef2f2;color:#b91c1c;border-left-color:var(--verm)}
.lead-prox.atras{background:#fff1f2;color:#be123c;border-left-color:#fb7185;font-weight:700}
.lead-prox.ok{background:#ecfdf5;color:#047857;border-left-color:var(--ver)}
.lead-btns{display:flex;gap:6px;margin-top:10px}
.lead-btns button{flex:1;padding:9px 6px;border-radius:9px;border:1.5px solid var(--linha);background:#fff;color:#334155;font-size:11.5px;font-weight:800;cursor:pointer}
.lead-btns button:active{background:#f1f5f9}
.lead-btns .b-at{background:var(--azu);color:#fff;border-color:var(--azu)}
.lead-btns .b-wa{flex:0 0 auto;padding:9px 12px;background:#25d366;color:#fff;border-color:#25d366}
.cont{display:inline-flex;align-items:center;gap:4px;background:#eef4fb;color:#1d4ed8;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px}
.cont.zero{background:#fff1f2;color:#be123c}
.dia{margin-bottom:14px}
.dia-tit{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.dia-tit .d{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--cz)}
.dia-tit .q{font-size:10.5px;color:var(--cz2);font-weight:700}
.dia-tit .d.atras{color:var(--verm)}
.vazio{text-align:center;padding:38px 22px;color:var(--cz2);font-size:13px;background:var(--branco);border-radius:var(--r);border:1px dashed var(--linha);line-height:1.6}
.vazio .emo{font-size:34px;display:block;margin-bottom:9px;opacity:.6}
.aviso{background:#fffbeb;border-left:3px solid var(--amb);border-radius:10px;padding:11px 12px;font-size:11.5px;color:#92400e;line-height:1.55;margin-bottom:10px}
.aviso b{color:#78350f}
.lanc{background:var(--branco);border-radius:12px;padding:11px 13px;margin-bottom:7px;border:1px solid var(--linha);box-shadow:0 1px 2px rgba(15,23,42,.04);display:flex;gap:10px;align-items:flex-start}
.lanc .ponto{width:8px;height:8px;border-radius:50%;background:var(--azu);margin-top:5px;flex:0 0 8px}
.lanc .c{flex:1;min-width:0}
.lanc .cl{font-size:13px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc .r{font-size:11.5px;font-weight:700;margin-top:2px}
.lanc .dt{font-size:10px;color:var(--cz2);margin-top:3px}
.cls-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.cls{display:flex;flex-direction:column;align-items:flex-start;padding:12px 11px;border-radius:13px;border:2px solid var(--linha);background:#fff;cursor:pointer;transition:.13s;text-align:left;position:relative;min-height:74px;justify-content:center}
.cls:active{transform:scale(.97)}
.cls .e{font-size:19px;line-height:1}
.cls .r{font-size:12.5px;font-weight:800;letter-spacing:-.3px;line-height:1.15;margin-top:3px}
.cls .d{font-size:9.5px;color:var(--cz2);line-height:1.2;margin-top:1px}
.cls.on{border-color:currentColor;box-shadow:0 0 0 4px rgba(0,0,0,.05)}
.cls.on::after{content:'\2713';position:absolute;top:7px;right:9px;font-size:12px;font-weight:900;color:currentColor}
.cls.off{opacity:.4}
.fab{position:fixed;right:16px;bottom:86px;width:56px;height:56px;border-radius:18px;border:none;cursor:pointer;z-index:60;background:linear-gradient(135deg,var(--lar),var(--lar2));color:#fff;font-size:26px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -6px rgba(249,115,22,.65);transition:.15s}
.fab:active{transform:scale(.94)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--linha);display:flex;padding:7px 5px 9px;box-shadow:0 -4px 20px rgba(15,23,42,.06)}
.nav button{flex:1;border:none;background:none;cursor:pointer;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--cz2);font-size:9.5px;font-weight:700;transition:.15s}
.nav button .i{font-size:18px;line-height:1}
.nav button.on{color:var(--lar)}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.55);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheet-box{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px 18px 24px;max-height:92vh;overflow-y:auto;animation:sobe .24s cubic-bezier(.2,.8,.3,1)}
@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}
.grip{width:38px;height:4px;border-radius:4px;background:var(--linha);margin:0 auto 14px}
.sheet-box h3{font-size:18px;letter-spacing:-.5px;margin-bottom:3px}
.sheet-box .sub{font-size:12px;color:var(--cz);margin-bottom:16px}
.sheet-acoes{display:flex;gap:8px;margin-top:8px}
.sheet-acoes .btn{flex:1}
.jr{background:#eff6ff;border-radius:11px;padding:12px;margin-bottom:14px;font-size:11.5px;color:#1d4ed8;line-height:1.6}
.jr b{font-size:13px}
.etapas{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.etapa-chip{background:#f8fafc;border:1px solid var(--linha);border-radius:9px;padding:7px 10px;font-size:10.5px;line-height:1.3}
.etapa-chip b{display:block;font-size:11px;margin-bottom:1px}
.etapa-chip span{color:var(--cz2);font-size:10px}
.tl{position:relative;padding-left:18px;margin-left:3px}
.tl::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--linha)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-22px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--azu);border:2px solid #fff;box-shadow:0 0 0 2px #dbeafe}
.tl-item:first-child::before{background:var(--lar);box-shadow:0 0 0 2px #ffedd5}
.tl-et{font-size:11px;font-weight:800}
.tl-res{font-size:11px;font-weight:700;margin-top:2px}
.tl-obs{font-size:11px;color:var(--cz);margin-top:2px;line-height:1.4}
.tl-dt{font-size:9.5px;color:var(--cz2);margin-top:2px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.dl .i{background:#f8fafc;border-radius:10px;padding:9px 10px;border:1px solid var(--linha)}
.dl .i .l{font-size:9px;font-weight:800;color:var(--cz2);text-transform:uppercase;letter-spacing:.3px}
.dl .i .v{font-size:12.5px;font-weight:700;margin-top:2px;word-break:break-word;line-height:1.3}
.dl .i.w{grid-column:span 2}
.loading{text-align:center;padding:36px;color:var(--cz2);font-size:12.5px}
.spin{width:28px;height:28px;border:3px solid var(--linha);border-top-color:var(--lar);border-radius:50%;animation:g .8s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}.resumo-topo{max-width:430px}.painel{max-width:720px;margin:0 auto}.abas{max-width:720px;margin:0 auto}.nav{max-width:720px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0}.fab{right:calc(50% - 348px)}}</style>
</head>
<body>

<div id="login"><div class="login-card">
  <div class="brand">
    <div class="brand-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" fill="#fff"/><path d="M12 1.5v1.6M12 12.9v1.6M5.5 8H3.9M20.1 8h-1.6M7.4 3.4L6.3 2.3M17.7 13.7l-1.1-1.1M7.4 12.6l-1.1 1.1M17.7 2.3l-1.1 1.1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M3 21l1.6-5.3h14.8L21 21H3z" fill="#fff" opacity=".55"/></svg></div>
    <div class="brand-txt">Mantena Solar<small>Gestão de Visitas · v3.1</small></div>
  </div>
  <h2>Entrar</h2><p class="sub">Use seu usuário e senha.</p>
  <div class="alerta err" id="erroLogin"></div>
  <div class="f"><label>Usuário</label><input type="text" id="uLogin" autocomplete="username" placeholder="Ex: Alisson" autocapitalize="none"></div>
  <div class="f"><label>Senha</label><input type="password" id="uSenha" autocomplete="current-password" placeholder="••••"></div>
  <button class="btn btn-p" onclick="entrar()">Entrar</button>
  <div class="loading" id="loginCarreg" style="display:none"><div class="spin"></div>Verificando...</div>
</div></div>

<div id="app">
  <div class="topo">
    <div class="topo-l1">
      <div class="topo-user"><div class="avatar" id="avatar">?</div><div style="min-width:0"><div class="topo-nome" id="nomeUser">—</div><div class="topo-perfil" id="perfilUser">—</div></div></div>
      <div class="topo-btns"><button class="ico-btn" onclick="carregar()" title="Atualizar">⟳</button><button class="ico-btn" onclick="sair()" title="Sair">⏻</button></div>
    </div>
    <div class="resumo-topo" id="resumoTopo"></div>
  </div>
  <div class="abas" id="abas"></div>
  <div class="painel">
    <div class="tela" id="telaInicio"></div>
    <div class="tela" id="telaLeads"></div>
    <div class="tela" id="telaAgenda"></div>
    <div class="tela" id="telaLanc"></div>

  <div class="grip"></div><h3>Jornada do cliente</h3><div class="sub" id="histSub">—</div>

<script>
var U = null, DADOS = null, ABA = 'inicio', EDIT = null, DETALHE = null, CLS_ESCOLHIDA = null;
var F = { q: '', etapa: '', vendedor: '', usina: '', ordem: 'parado' };
var IBGE = {'AC':12,'AL':27,'AP':16,'AM':13,'BA':29,'CE':23,'DF':53,'ES':32,'GO':52,'MA':21,'MT':51,'MS':50,'MG':31,'PA':15,'PB':25,'PR':41,'PE':26,'PI':22,'RJ':33,'RN':24,'RS':43,'RO':11,'RR':14,'SC':42,'SP':35,'SE':28,'TO':17};
var CLS = {'VISITA':'visita','ORÇAMENTO ENTREGUE':'orcamento','NEGOCIAÇÃO':'negociacao','GANHO':'ganho','PERDIDO':'perdido'};
var COR = {'VISITA':'#3b82f6','ORÇAMENTO ENTREGUE':'#f59e0b','NEGOCIAÇÃO':'#8b5cf6','GANHO':'#10b981','PERDIDO':'#ef4444'};

function num(v){ var n = parseFloat(String(v==null?'':v).replace(/[^\d,.]/g,'').replace(',','.')); return isNaN(n)?0:n; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function moeda(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0}); }
function sair(){ try{ localStorage.removeItem('ms_user'); }catch(e){} location.reload(); }

/* ---------------- LOGIN ---------------- */
function entrar(){
  var u = document.getElementById('uLogin').value.trim();
  var s = document.getElementById('uSenha').value.trim();
  var e = document.getElementById('erroLogin');
  e.style.display = 'none';
  if(!u || !s){ e.textContent = 'Informe usuário e senha.'; e.style.display='block'; return; }
  document.getElementById('loginCarreg').style.display = 'block';
  google.script.run.withSuccessHandler(function(r){
    document.getElementById('loginCarreg').style.display = 'none';
    if(!r || !r.ok){ e.textContent = (r && r.erro) || 'Não foi possível entrar.'; e.style.display='block'; return; }
    U = r.usuario; iniciarApp();
  }).withFailureHandler(function(err){
    document.getElementById('loginCarreg').style.display = 'none';
    e.textContent = 'Erro: ' + ((err && err.message) || 'tente de novo'); e.style.display='block';
  }).verificarLogin(u, s);
}

function iniciarApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('avatar').textContent = (U.nome || '?').charAt(0).toUpperCase();
  document.getElementById('nomeUser').textContent = U.nome;
  document.getElementById('perfilUser').textContent = U.gestor ? 'Gestor' : 'Vendedor';
  irAba('inicio', true);
  carregar();
}

function montarAbas(){
  var abas = [{id:'inicio',t:'Início'},{id:'leads',t:'Leads'},{id:'agenda',t:'Agenda'},{id:'lanc',t:'Lançamentos'}];
  var h = '';
  abas.forEach(function(a){ h += '<button class="aba' + (ABA===a.id?' on':'') + '" onclick="irAba(\'' + a.id + '\')">' + a.t + '</button>'; });
  document.getElementById('abas').innerHTML = h;
}

function montarNav(){
  var itens = [{id:'inicio',i:'\uD83C\uDFE0',t:'Início'},{id:'leads',i:'\uD83D\uDC65',t:'Leads'},{id:'agenda',i:'\uD83D\uDCC5',t:'Agenda'},{id:'lanc',i:'\uD83D\uDCDD',t:'Lançamentos'}];
  var h = '';
  itens.forEach(function(x){ h += '<button class="' + (ABA===x.id?'on':'') + '" onclick="irAba(\'' + x.id + '\')"><span class="i">' + x.i + '</span>' + x.t + '</button>'; });
  document.getElementById('nav').innerHTML = h;
}

function irAba(id, semScroll){
  ABA = id;
  ['inicio','leads','agenda','lanc'].forEach(function(t){
    var el = document.getElementById('tela' + t.charAt(0).toUpperCase() + t.slice(1));
    if(el) el.classList.remove('on');
  });
  var alvo = document.getElementById('tela' + id.charAt(0).toUpperCase() + id.slice(1));
  if(alvo) alvo.classList.add('on');
  montarAbas(); montarNav();
  if(!semScroll) window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- DADOS ---------------- */
function carregar(){
  google.script.run.withSuccessHandler(function(d){
    if(!d){ return; }
    DADOS = d;
    if(d.usuario) U = d.usuario;
    montarFiltrosVendedor();
    renderTudo();
  }).withFailureHandler(function(err){
    document.getElementById('telaInicio').innerHTML = '<div class="vazio"><span class="emo">\u26A0\uFE0F</span>Erro ao carregar<br>' + esc((err&&err.message)||'') + '</div>';
  }).getTudo(U);
}

function renderTudo(){
  var r = DADOS.resumo || {};
  var rt = '';
  rt += '<div class="rt"><div class="n">' + (r.total||0) + '</div><div class="l">Leads</div></div>';
  rt += '<div class="rt' + ((r.atrasados||0)>0?' al':'') + '"><div class="n">' + (r.atrasados||0) + '</div><div class="l">Atrasados</div></div>';
  rt += '<div class="rt"><div class="n">' + (r.semana||0) + '</div><div class="l">Na semana</div></div>';
  document.getElementById('resumoTopo').innerHTML = rt;
  renderInicio(); renderLeads(); renderAgenda(); renderLanc();
}

/* ---------------- INÍCIO ---------------- */
function kpi(l,n,d,c){ return '<div class="kpi ' + (c||'') + '"><div class="l">' + l + '</div><div class="n">' + n + '</div><div class="d">' + d + '</div></div>'; }

function renderInicio(){
  var r = DADOS.resumo || {}, h = '';
  h += '<div class="kpis">';
  h += kpi('Ganhos', r.ganhos||0, (r.perdidos||0) + ' perdidos', (r.ganhos||0)>0?'ok':'');
  h += kpi('Conversão', (r.conversao||0) + '%', 'sobre o total', '');
  h += kpi('Sem contato', r.semProximo||0, 'sem data marcada', (r.semProximo||0)>0?'al':'');
  h += kpi('Em aberto', r.abertos||0, 'leads ativos', '');
  h += '</div>';

  h += '<div class="card"><div class="sec-tit" style="margin:0 0 9px"><h3>Funil</h3></div>';
  var tot = r.total || 1, b = '', l = '';
  ['VISITA','ORÇAMENTO ENTREGUE','NEGOCIAÇÃO','GANHO','PERDIDO'].forEach(function(e){
    var n = (r.porEtapa && r.porEtapa[e]) || 0, pct = Math.round(n/tot*100);
    if(n>0) b += '<div style="flex:' + n + ';background:' + COR[e] + '">' + (pct>=9?n:'') + '</div>';
    l += '<div><span class="dot" style="background:' + COR[e] + '"></span>' + e.charAt(0) + e.slice(1).toLowerCase() + ' <b>' + n + '</b></div>';
  });
  h += '<div class="barra">' + (b || '<div style="flex:1;background:#e2e8f0"></div>') + '</div>';
  h += '<div class="leg">' + l + '</div></div>';

  var ag = DADOS.agenda || [];
  var ater = ag.filter(function(x){ return x.atrasado; });
  var hoje = ag.filter(function(x){ return x.diasParaContato === 0; });
  if(ater.length){
    h += '<div class="sec-tit"><h3 style="color:#be123c">Atrasados</h3><span class="n">' + ater.length + '</span></div>';
    ater.slice(0,3).forEach(function(v){ h += cardLead(v); });
    if(ater.length>3) h += '<button class="btn btn-s" onclick="irAba(\'agenda\')">Ver todos os ' + ater.length + ' atrasados</button>';
  }
  if(hoje.length){
    h += '<div class="sec-tit"><h3>Para hoje</h3><span class="n">' + hoje.length + '</span></div>';
    hoje.slice(0,3).forEach(function(v){ h += cardLead(v); });
  }
  if(!ater.length && !hoje.length){
    var reat = (DADOS.reativar||[]).length;
    h += '<div class="vazio" style="margin-top:14px"><span class="emo">\u2705</span>Nada atrasado e nada para hoje.<br>';
    if(reat) h += '<b>' + reat + '</b> leads ainda sem próximo contato marcado.<br><button class="btn btn-s" style="margin-top:12px" onclick="irAba(\'agenda\')">Ver a lista para reativar</button>';
    h += '</div>';
  }
  document.getElementById('telaInicio').innerHTML = h;
}

/* ---------------- LEADS: FILTROS ---------------- */
function montarFiltrosVendedor(){
  var sel = document.getElementById('fVendedor');
  if(!sel) return;
}

function opcoesVendedor(){
  var vs = DADOS.vendedores || [];
  var h = '<option value="">Todos os vendedores</option>';
  vs.forEach(function(v){ h += '<option value="' + esc(v.id) + '">' + esc(v.nome) + '</option>'; });
  return h;
}

function faixaUsina(kwp){
  var k = num(kwp);
  if(!k) return 'sem';
  if(k <= 750) return 'a';
  if(k <= 1200) return 'b';
  if(k <= 2000) return 'c';
  return 'd';
}

function renderLeads(){
  var vs = DADOS.visitas || [], h = '';
  var contagem = { VISITA:0, 'ORÇAMENTO ENTREGUE':0, 'NEGOCIAÇÃO':0, GANHO:0, PERDIDO:0 };
  vs.forEach(function(v){ if(contagem[v.etapa]!==undefined) contagem[v.etapa]++; });

  h += '<div class="filtros">';
  h += '<div class="busca"><span class="lupa">\uD83D\uDD0D</span>';
  h += '<input type="text" id="buscaLead" placeholder="Buscar por cliente, telefone ou cidade..." oninput="aoBuscar()" value="' + esc(F.q) + '">';
  h += '<button class="limpar" id="btnLimparBusca" onclick="limparBusca()" style="display:' + (F.q?'flex':'none') + '">\u00D7</button></div>';

  h += '<div class="filtros-l2">';
  h += '<select id="selVendedor" onchange="aoFiltrar()">' + opcoesVendedor() + '</select>';
  h += '<select id="selUsina" onchange="aoFiltrar()">';
  h += '<option value="">Qualquer usina</option>';
  h += '<option value="a">até 750 kWp</option>';
  h += '<option value="b">751 a 1.200 kWp</option>';
  h += '<option value="c">1.201 a 2.000 kWp</option>';
  h += '<option value="d">acima de 2.000 kWp</option>';
  h += '<option value="sem">sem medida</option>';
  h += '</select></div>';

  h += '<div class="filtros-l2" style="margin-top:7px">';
  h += '<select id="selOrdem" onchange="aoFiltrar()">';
  h += '<option value="parado">Mais tempo parado</option>';
  h += '<option value="recente">Mais recente</option>';
  h += '<option value="nome">Nome (A-Z)</option>';
  h += '<option value="usina">Maior usina</option>';
  h += '</select>';
  h += '<button class="chip" style="flex:0 0 auto" onclick="exportarCSV()">\u2B07\uFE0F Exportar</button>';
  h += '</div>';

  h += '<div class="chips" id="chipsEtapa">';
  h += '<button class="chip' + (F.etapa===''?' on':'') + '" onclick="aoEtapa(\'\')">Todos <span class="b">' + vs.length + '</span></button>';
  ['VISITA','ORÇAMENTO ENTREGUE','NEGOCIAÇÃO','GANHO','PERDIDO'].forEach(function(e){
    if(contagem[e] > 0){
      h += '<button class="chip' + (F.etapa===e?' on':'') + '" onclick="aoEtapa(\'' + e + '\')">' + e.charAt(0) + e.slice(1).toLowerCase() + ' <span class="b">' + contagem[e] + '</span></button>';
    }
  });
  h += '</div></div>';

  h += '<div class="resultado"><span id="contadorLeads"></span><button class="zerar" onclick="zerarFiltros()">Limpar filtros</button></div>';
  h += '<div id="listaLeads"></div>';

  document.getElementById('telaLeads').innerHTML = h;
  document.getElementById('selVendedor').value = F.vendedor;
  document.getElementById('selUsina').value = F.usina;
  document.getElementById('selOrdem').value = F.ordem;
  aplicarFiltros();
}

function aoBuscar(){
  var el = document.getElementById('buscaLead');
  F.q = el ? el.value : '';
  var b = document.getElementById('btnLimparBusca');
  if(b) b.style.display = F.q ? 'flex' : 'none';
  aplicarFiltros();
}

function limparBusca(){
  F.q = '';
  var el = document.getElementById('buscaLead');
  if(el){ el.value = ''; }
  var b = document.getElementById('btnLimparBusca');
  if(b) b.style.display = 'none';
  aplicarFiltros();
}

function aoFiltrar(){
  var v = document.getElementById('selVendedor'), u = document.getElementById('selUsina'), o = document.getElementById('selOrdem');
  F.vendedor = v ? v.value : '';
  F.usina = u ? u.value : '';
  F.ordem = o ? o.value : 'parado';
  aplicarFiltros();
}

function aoEtapa(e){
  F.etapa = e;
  var chips = document.querySelectorAll('#chipsEtapa .chip');
  for(var i=0;i<chips.length;i++){
    var txt = chips[i].textContent.toLowerCase();
    var alvo = e==='' ? 'todos' : e.charAt(0) + e.slice(1).toLowerCase();
    chips[i].className = 'chip' + (txt.indexOf(alvo)===0 ? ' on' : '');
  }
  aplicarFiltros();
}

function zerarFiltros(){
  F = { q:'', etapa:'', vendedor:'', usina:'', ordem:'parado' };
  renderLeads();
}

function normaliza(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[áàãâä]/g,'a').replace(/[éèêë]/g,'e').replace(/[íìîï]/g,'i')
    .replace(/[óòõôö]/g,'o').replace(/[úùûü]/g,'u').replace(/ç/g,'c');
}

function filtrarLista(){
  var vs = DADOS.visitas || [];
  var q = normaliza(F.q.trim());
  var qDig = F.q.replace(/\D/g,'');
  var out = vs.filter(function(v){
    if(F.etapa && v.etapa !== F.etapa) return false;
    if(F.vendedor && v.vendedor !== F.vendedor) return false;
    if(F.usina && faixaUsina(v.kwp) !== F.usina) return false;
    if(q){
      var alvo = normaliza(v.cliente + ' ' + v.cidade + ' ' + v.bairro + ' ' + v.vendedorNome + ' ' + v.etapa);
      var ok = alvo.indexOf(q) > -1;
      if(!ok && qDig && String(v.telefone||'').replace(/\D/g,'').indexOf(qDig) > -1) ok = true;
      if(!ok) return false;
    }
    return true;
  });

  out.sort(function(a,b){
    var fa = (a.etapa==='GANHO'||a.etapa==='PERDIDO')?1:0;
    var fb = (b.etapa==='GANHO'||b.etapa==='PERDIDO')?1:0;
    if(F.ordem==='nome') return String(a.cliente).localeCompare(String(b.cliente));
    if(F.ordem==='usina') return num(b.kwp) - num(a.kwp);
    if(F.ordem==='recente') return (b.linha||0) - (a.linha||0);
    if(fa !== fb) return fa - fb;
    return (b.diasParado||0) - (a.diasParado||0);
  });
  return out;
}

function aplicarFiltros(){
  var lista = filtrarLista();
  var tot = (DADOS.visitas||[]).length;
  var el = document.getElementById('contadorLeads');
  if(el){
    var txt = 'Mostrando <b>' + lista.length + '</b> de ' + tot + ' leads';
    if(F.vendedor){
      var nome = F.vendedor.replace('vend_','').replace('gerent_','');
      txt += ' · ' + nome;
    }
    el.innerHTML = txt;
  }
  renderListaLeads(lista);
}

function renderListaLeads(vs){
  var el = document.getElementById('listaLeads');
  if(!el) return;
  if(!vs || !vs.length){
    el.innerHTML = '<div class="vazio"><span class="emo">\uD83D\uDD0E</span>Nenhum lead com esses filtros.<br><br><button class="btn btn-s" onclick="zerarFiltros()">Limpar filtros</button></div>';
    return;
  }
  var h = '';
  vs.forEach(function(v){ h += cardLead(v); });
  el.innerHTML = h;
}

/* ---------------- CARD ---------------- */
function cardLead(v){
  var cls = CLS[v.etapa] || '';
  var h = '<div class="lead v-' + cls + (v.atrasado?' atras':'') + '" onclick="abrirDetalhe(\'' + v.id + '\')">';
  h += '<div class="lead-l1"><div style="min-width:0"><div class="lead-nome">' + esc(v.cliente) + '</div>';
  h += '<div class="lead-meta">' + esc(v.vendedorNome) + ' · ' + esc(v.cidade || '—') + (v.data ? ' · ' + esc(v.data) : '') + '</div></div>';
  h += '<span class="tag t-' + cls + '">' + esc(v.etapa) + '</span></div>';

  var infos = [];
  if(v.telefone) infos.push('\uD83D\uDCDE ' + esc(v.telefone));
  if(v.kwp) infos.push('\u26A1 ' + esc(v.kwp) + ' kWp');
  if(v.valor) infos.push('\uD83D\uDCB0 R$ ' + moeda(v.valor));
  if(v.diasParado!==null && v.diasParado>=0) infos.push('\uD83D\uDD50 ' + v.diasParado + 'd parado');
  if(infos.length) h += '<div class="lead-info">' + infos.join('') + '</div>';

  h += '<div class="lead-info" style="margin-top:8px"><span class="cont' + (v.atendimentos?'':' zero') + '">\uD83D\uDCCB ' + (v.atendimentos||0) + ' contato' + (v.atendimentos===1?'':'s') + '</span>';
  if(v.ultimoAtendimento) h += '<span style="font-size:10px;color:#94a3b8">' + esc(v.ultimoAtendimento) + '</span>';
  else h += '<span style="font-size:10px;color:#be123c">nenhum contato</span>';
  h += '</div>';

  if(v.etapa==='PERDIDO' && v.motivoPerda){
    h += '<div class="lead-prox sem">Motivo: ' + esc(v.motivoPerda) + '</div>';
  } else if(v.etapa!=='GANHO' && v.etapa!=='PERDIDO'){
    if(v.proximoContato){
      var c = v.atrasado ? ' atras' : (v.diasParaContato===0 ? ' ok' : '');
      var ico = v.atrasado ? ('\u26A0\uFE0F Venceu há ' + v.diasAtraso + 'd') : (v.diasParaContato===0 ? '\uD83D\uDCC5 Hoje' : '\uD83D\uDCC5 ' + v.proximoContato);
      h += '<div class="lead-prox' + c + '">' + ico + (v.proximaAcao ? ' — ' + esc(v.proximaAcao) : '') + '</div>';
    } else {
      h += '<div class="lead-prox sem">\u26A0\uFE0F Sem próximo contato marcado</div>';
    }
  }

  h += '<div class="lead-btns"><button class="' + (v.etapa!=='GANHO'&&v.etapa!=='PERDIDO'?'b-at':'') + '" onclick="event.stopPropagation();abrirAt(\'' + v.id + '\')">Registrar contato</button>';
  if(v.telefone){
    var tel = String(v.telefone).replace(/\D/g,'');
    if(tel.length <= 11) tel = '55' + tel;
    h += '<button class="b-wa" onclick="event.stopPropagation();window.open(\'https://wa.me/' + tel + '\',\'_blank\')">\u25D7</button>';
  }
  h += '</div></div>';
  return h;
}

/* ---------------- DETALHE ---------------- */
function abrirDetalhe(id){
  var v = null;
  (DADOS.visitas||[]).forEach(function(x){ if(x.id===id) v = x; });
  if(!v) return;
  DETALHE = v;
  document.getElementById('detNome').textContent = v.cliente;
  document.getElementById('detSub').textContent = v.vendedorNome + ' · ' + v.etapa + (v.cidade ? ' · ' + v.cidade : '');

  var end = [v.endereco, v.numero].filter(function(x){return x;}).join(', ');
  var h = '<div class="dl">';
  function item(l,val,w){ if(!val) return ''; return '<div class="i' + (w?' w':'') + '"><div class="l">' + l + '</div><div class="v">' + esc(val) + '</div></div>'; }
  h += item('Telefone', v.telefone);
  h += item('Cidade', v.cidade ? (v.cidade + ' / ' + (v.uf||'')) : '');
  h += item('Endereço', end, true);
  h += item('Bairro', v.bairro);
  h += item('CEP', v.cep);
  h += item('Usina', v.kwp ? v.kwp + ' kWp' : '');
  h += item('Valor', v.valor ? 'R$ ' + moeda(v.valor) : '');
  h += item('Telhado', v.telhado);
  h += item('Zona', v.zona);
  h += item('Data da visita', v.data);
  h += item('Dias parado', (v.diasParado!==null && v.diasParado>=0) ? v.diasParado + ' dias' : '');
  h += item('Contatos', v.atendimentos ? v.atendimentos + ' registrado(s)' : 'nenhum');
  h += item('Próximo contato', v.proximoContato || 'não marcado');
  h += item('O que fazer', v.proximaAcao);
  if(v.motivoPerda) h += item('Motivo da perda', v.motivoPerda, true);
  h += '</div>';

  h += '<div id="detHist" class="loading" style="padding:18px"><div class="spin"></div>Buscando histórico...</div>';
  document.getElementById('detCorpo').innerHTML = h;

  var btn = document.getElementById('detBtn');
  if(v.etapa==='GANHO' || v.etapa==='PERDIDO'){ btn.style.display='none'; }
  else { btn.style.display='block'; }

  abrir('sheetDet');

  google.script.run.withSuccessHandler(function(j){
    var el = document.getElementById('detHist');
    if(!el) return;
    if(!j || !j.atendimentos || !j.atendimentos.length){
      el.className = 'vazio';
      el.style.padding = '22px';
      el.innerHTML = 'Nenhum contato registrado ainda.<br>Toque em <b>Registrar contato</b> abaixo.';
      return;
    }
    el.className = '';
    el.style.padding = '0';
    el.innerHTML = '<div class="sec-tit" style="margin:0 0 9px"><h3>Histórico</h3><span class="n">' + j.total + '</span></div>' +
      '<div class="tl">' + timelineHTML(j) + '</div>';
  }).withFailureHandler(function(){
    var el = document.getElementById('detHist');
    if(el){ el.className=''; el.innerHTML = ''; }
  }).getJornada(v.id);
}

function timelineHTML(j){
  var h = '';
  (j.atendimentos||[]).forEach(function(a){
    var info = infoClass(a.resultado);
    h += '<div class="tl-item"><div class="tl-et">' + esc(a.etapa) + ' · ' + esc(a.tipo) + '</div>';
    h += '<div class="tl-res" style="color:' + info.cor + '">' + info.emoji + ' ' + esc(a.resultado) + '</div>';
    if(a.motivo) h += '<div class="tl-obs" style="color:#b45309">Motivo: ' + esc(a.motivo) + '</div>';
    if(a.observacao) h += '<div class="tl-obs">' + esc(a.observacao) + '</div>';
    if(a.proximoContato) h += '<div class="tl-obs" style="color:#1d4ed8">\u2192 ' + esc(a.proximoContato) + (a.proximaAcao ? ' — ' + esc(a.proximaAcao) : '') + '</div>';
    h += '<div class="tl-dt">' + esc(a.data) + ' · por ' + esc(a.criadoPor) + '</div></div>';
  });
  return h;
}

function detAt(){
  if(DETALHE){ fechar('sheetDet'); abrirAt(DETALHE.id); }
}

function infoClass(rotulo){
  var lista = (DADOS.opcoes && DADOS.opcoes.classificacoes) || [];
  var alvo = String(rotulo||'').toUpperCase();
  for(var i=0;i<lista.length;i++){ if(String(lista[i].rotulo).toUpperCase()===alvo) return lista[i]; }
  return { emoji:'\u2022', cor:'#3b82f6' };
}

/* ---------------- AGENDA ---------------- */
function renderAgenda(){
  var ag = DADOS.agenda || [], reat = DADOS.reativar || [], h = '';
  var tot = (DADOS.visitas||[]).length;

  h += '<div class="sec-tit" style="margin-top:2px"><h3>Próximos contatos</h3><span class="n">' + ag.length + ' marcado(s)</span></div>';

  if(!ag.length){
    h += '<div class="aviso"><b>Nenhum próximo contato marcado ainda.</b><br>Os ' + tot + ' leads entraram na planilha sem data de retorno. Abra um lead, toque em <b>Registrar contato</b> e marque o dia — ele passa a aparecer aqui, organizado por Hoje / Amanhã / Semana.</div>';
  } else {
    var grupos = {};
    ag.forEach(function(v){
      var k;
      if(v.atrasado) k = 'ATRASADOS';
      else if(v.diasParaContato===0) k = 'HOJE';
      else if(v.diasParaContato===1) k = 'AMANHÃ';
      else k = 'EM ' + (v.diasParaContato||0) + ' DIAS';
      if(!grupos[k]) grupos[k] = [];
      grupos[k].push(v);
    });
    var ordem = ['ATRASADOS','HOJE','AMANHÃ'];
    var chaves = Object.keys(grupos).sort(function(a,b){
      var ia = ordem.indexOf(a), ib = ordem.indexOf(b);
      if(ia<0) ia = 99; if(ib<0) ib = 99;
      if(ia !== ib) return ia - ib;
      return a.localeCompare(b);
    });
    chaves.forEach(function(k){
      var lista = grupos[k];
      h += '<div class="dia"><div class="dia-tit"><span class="d' + (k==='ATRASADOS'?' atras':'') + '">' + k + '</span><span class="q">' + lista.length + '</span></div>';
      lista.forEach(function(v){ h += cardLead(v); });
      h += '</div>';
    });
  }

  if(reat.length){
    h += '<div class="dia"><div class="dia-tit"><span class="d" style="color:#b45309">SEM DATA DE RETORNO</span><span class="q">' + reat.length + '</span></div>';
    h += '<div class="aviso">Estes leads <b>nunca tiveram próximo contato marcado</b>. Comece pelos de <b>orçamento entregue</b> — são os mais quentes. Toque no lead e registre o contato.</div>';
    reat.slice(0,10).forEach(function(v){ h += cardLead(v); });
    if(reat.length > 10){
      h += '<button class="btn btn-s" style="margin-bottom:8px" onclick="verReativarTodos()">Ver os outros ' + (reat.length-10) + ' leads</button>';
      h += '<div id="reatResto"></div>';
    }
    h += '</div>';
  }

  document.getElementById('telaAgenda').innerHTML = h;
}

function verReativarTodos(){
  var reat = (DADOS.reativar||[]).slice(10);
  var h = '';
  reat.forEach(function(v){ h += cardLead(v); });
  document.getElementById('reatResto').innerHTML = h;
}

/* ---------------- EXPORTAR ---------------- */
function exportarCSV(){
  var lista = filtrarLista();
  if(!lista.length){ alert('Nada para exportar com esses filtros.'); return; }
  var cab = ['Cliente','Telefone','Cidade','Bairro','kWp','Valor','Etapa','Vendedor','Data visita','Dias parado','Contatos','Próximo contato','Próxima ação'];
  var linhas = [cab.join(';')];
  lista.forEach(function(v){
    linhas.push([
      v.cliente, v.telefone, v.cidade, v.bairro, v.kwp, v.valor, v.etapa, v.vendedorNome,
      v.data, v.diasParado, v.atendimentos, v.proximoContato, v.proximaAcao
    ].map(function(x){ return String(x==null?'':x).replace(/;/g,','); }).join(';'));
  });
  var csv = '\uFEFF' + linhas.join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'leads-mantena-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 500);
}

  });

    document.getElementById('fVendedor').style.display = 'none';
    document.getElementById('novaSub').textContent = 'Cadastrando em seu nome';
  }
  document.getElementById('novaErro').style.display = 'none';
  document.getElementById('novaAviso').style.display = 'none';
  document.getElementById('btnNova').style.display = 'block';
  ['nCliente','nTelefone','nEndereco','nNumero','nBairro','nCep','nKwp','nValor','nObs','nProx'].forEach(function(id){
    var e = document.getElementById(id); if(e) e.value = '';
  });

function carregaCidades(){
  var uf = document.getElementById('nUf').value;
  var sel = document.getElementById('nCidade');
  sel.innerHTML = '<option value="">Carregando...</option>';
  fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/' + IBGE[uf] + '/municipios')
    .then(function(r){ return r.json(); })
    .then(function(cs){
      cs.sort(function(a,b){ return a.nome.localeCompare(b.nome); });
      sel.innerHTML = '<option value="">Selecione...</option>';
      cs.forEach(function(c){
        var o = document.createElement('option');
        o.value = c.nome; o.textContent = c.nome; sel.appendChild(o);
      });
      if(uf==='ES') sel.value = 'Mantenópolis';
    })
    .catch(function(){ sel.innerHTML = '<option value="">Erro ao carregar</option>'; });
}

function salvarNova(){
  var erro = document.getElementById('novaErro');
  erro.style.display = 'none';
  var d = {
    vendedor: U.gestor ? document.getElementById('nVendedor').value : U.id,
    etapa: document.getElementById('nEtapa').value,
    cliente: document.getElementById('nCliente').value.trim(),
    telefone: document.getElementById('nTelefone').value.trim(),
    uf: document.getElementById('nUf').value,
    cidade: document.getElementById('nCidade').value,
    endereco: document.getElementById('nEndereco').value.trim(),
    numero: document.getElementById('nNumero').value.trim(),
    bairro: document.getElementById('nBairro').value.trim(),
    cep: document.getElementById('nCep').value.trim(),
    telhado: document.getElementById('nTelhado').value,
    zona: document.getElementById('nZona').value,
    kwp: document.getElementById('nKwp').value.trim(),
    valor: document.getElementById('nValor').value.trim(),
    proximoContato: document.getElementById('nProx').value,
    proximaAcao: document.getElementById('nAcao').value,
    observacoes: document.getElementById('nObs').value.trim()
  };
  var falta = [];
  if(!d.vendedor) falta.push('vendedor');
  if(!d.cliente) falta.push('nome');
  if(!d.telefone) falta.push('telefone');
  if(!d.cidade) falta.push('cidade');
  if(falta.length){ erro.textContent = 'Preencha: ' + falta.join(', ') + '.'; erro.style.display='block'; return; }
  if(d.telefone.replace(/\D/g,'').length < 10){ erro.textContent = 'Telefone incompleto. Use DDD + número.'; erro.style.display='block'; return; }

  document.getElementById('btnNova').style.display = 'none';
  document.getElementById('novaCarreg').style.display = 'block';
  google.script.run.withSuccessHandler(function(r){
    document.getElementById('btnNova').style.display = 'block';
    document.getElementById('novaCarreg').style.display = 'none';
    if(r && r.duplicado){
      var av = document.getElementById('novaAviso');
      av.innerHTML = '<b>Telefone já cadastrado</b><br>' + (r.mensagem||'');
      av.style.display = 'block';
      return;
    }
    if(!r || !r.ok){ erro.textContent = (r && r.mensagem) || 'Não foi possível salvar.'; erro.style.display='block'; return; }
    fechar('sheetNova'); carregar();
  }).withFailureHandler(function(err){
    document.getElementById('btnNova').style.display = 'block';
    document.getElementById('novaCarreg').style.display = 'none';
    erro.textContent = 'Erro: ' + ((err&&err.message)||'tente de novo'); erro.style.display='block';
  }).salvarVisita(d, U);
}

/* ---------------- REGISTRAR CONTATO ---------------- */
function abrirAt(id){
  var v = null;
  (DADOS.visitas||[]).forEach(function(x){ if(x.id===id) v = x; });
  if(!v) return;
  EDIT = v; CLS_ESCOLHIDA = null;
  document.getElementById('atSub').textContent = v.cliente + ' · ' + v.vendedorNome;
  document.getElementById('atErro').style.display = 'none';
  document.getElementById('atObs').value = '';
  document.getElementById('atProx').value = '';
  document.getElementById('atAcao').value = '';
  document.getElementById('atTipo').value = 'WHATSAPP';
  document.getElementById('btnAt').style.display = 'block';
  document.getElementById('atCarreg').style.display = 'none';
  document.getElementById('fAtAcao').style.display = 'block';
  montarClassificacoes();
  atualizarBotoesClass();
  abrir('sheetAt');
}

function montarClassificacoes(){
  var lista = (DADOS.opcoes && DADOS.opcoes.classificacoes) || [], h = '';
  lista.forEach(function(c){
    h += '<button class="cls" data-cls="' + c.id + '" style="color:' + c.cor + '" onclick="escolherClass(\'' + c.id + '\')">';
    h += '<span class="e">' + c.emoji + '</span><span class="r">' + c.rotulo + '</span><span class="d">' + c.desc + '</span></button>';
  });
  document.getElementById('atGrid').innerHTML = h;
}

function escolherClass(id){
  CLS_ESCOLHIDA = id;
  atualizarBotoesClass();
  var fecha = (id==='VENDA_REALIZADA' || id==='SEM_INTERESSE' || id==='CURIOSO');
  document.getElementById('fAtAcao').style.display = fecha ? 'none' : 'block';
  if(fecha) document.getElementById('atProx').value = '';
}

function atualizarBotoesClass(){
  var bts = document.querySelectorAll('#atGrid .cls');
  for(var i=0;i<bts.length;i++){
    var el = bts[i];
    if(!CLS_ESCOLHIDA){ el.classList.remove('on','off'); }
    else if(el.getAttribute('data-cls')===CLS_ESCOLHIDA){ el.classList.add('on'); el.classList.remove('off'); }
    else { el.classList.add('off'); el.classList.remove('on'); }
  }
}

function salvarAt(){
  if(!EDIT) return;
  var erro = document.getElementById('atErro');
  erro.style.display = 'none';
  if(!CLS_ESCOLHIDA){ erro.textContent = 'Toque no que aconteceu para continuar.'; erro.style.display='block'; return; }
  var prox = document.getElementById('atProx').value;
  var acao = document.getElementById('atAcao').value;
  var obs = document.getElementById('atObs').value.trim();
  var fecha = (CLS_ESCOLHIDA==='VENDA_REALIZADA' || CLS_ESCOLHIDA==='SEM_INTERESSE' || CLS_ESCOLHIDA==='CURIOSO');
  if(!fecha && !prox){ erro.textContent = 'Marque quando vai falar com o cliente de novo.'; erro.style.display='block'; return; }

  document.getElementById('btnAt').style.display = 'none';
  document.getElementById('atCarreg').style.display = 'block';
  var mapa = {'VISITA':'CAPTAÇÃO','ORÇAMENTO ENTREGUE':'APRESENTAÇÃO DO ORÇAMENTO','NEGOCIAÇÃO':'NEGOCIAÇÃO','GANHO':'PÓS-VENDA','PERDIDO':'FECHAMENTO'};
  google.script.run.withSuccessHandler(function(r){
    document.getElementById('btnAt').style.display = 'block';
    document.getElementById('atCarreg').style.display = 'none';
    if(!r || !r.ok){ erro.textContent = (r && r.mensagem) || 'Não foi possível registrar.'; erro.style.display='block'; return; }
    fechar('sheetAt'); carregar();
  }).withFailureHandler(function(err){
    document.getElementById('btnAt').style.display = 'block';
    document.getElementById('atCarreg').style.display = 'none';
    erro.textContent = 'Erro: ' + ((err&&err.message)||'tente de novo'); erro.style.display='block';
  }).registrarAtendimento({
    idVisita: EDIT.id, cliente: EDIT.cliente, vendedor: EDIT.vendedor,
    classificacao: CLS_ESCOLHIDA, etapa: mapa[EDIT.etapa] || 'CAPTAÇÃO',
    tipo: document.getElementById('atTipo').value,
    proximoContato: prox, proximaAcao: acao, observacao: obs
  }, U);
}

    if(j.etapas && j.etapas.length){
      h += '<div class="sec-tit" style="margin:0 0 7px"><h3>Tempo por etapa</h3></div><div class="etapas">';
      j.etapas.forEach(function(e){ h += '<div class="etapa-chip"><b>' + esc(e.etapa) + '</b><span>' + e.dias + ' dias</span></div>'; });
      h += '</div>';
    }
    h += '<div class="sec-tit" style="margin:0 0 9px"><h3>Linha do tempo</h3></div><div class="tl">' + timelineHTML(j) + '</div>';
    document.getElementById('histCorpo').innerHTML = h;
  }).withFailureHandler(function(err){
    document.getElementById('histCorpo').innerHTML = '<div class="vazio">Erro: ' + esc((err&&err.message)||'') + '</div>';
  }).getJornada(id);
}

/* ---------------- UTIL ---------------- */
function abrir(id){ document.getElementById(id).classList.add('on'); }
function fechar(id){ document.getElementById(id).classList.remove('on'); }
function mascaraTel(el){
  var v = el.value.replace(/\D/g,'').substring(0,11);
  if(v.length > 6){ var c = v.length > 10 ? 7 : 6; el.value = '(' + v.substring(0,2) + ') ' + v.substring(2,c) + '-' + v.substring(c); }
  else if(v.length > 2){ el.value = '(' + v.substring(0,2) + ') ' + v.substring(2); }
  else { el.value = v; }
}
function mascaraCep(el){
  var v = el.value.replace(/\D/g,'').substring(0,8);
  el.value = v.length > 5 ? v.substring(0,5) + '-' + v.substring(5) : v;
}

document.querySelectorAll('.sheet').forEach(function(s){
  s.addEventListener('click', function(e){ if(e.target === s) s.classList.remove('on'); });
});

(function(){
  try{ localStorage.removeItem('ms_user'); }catch(e){}
  document.getElementById('login').style.display = 'flex';
  var s = document.getElementById('uSenha');
  if(s) s.addEventListener('keydown', function(e){ if(e.key === 'Enter') entrar(); });
})();
</script>
