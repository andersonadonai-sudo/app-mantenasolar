<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Mantena Solar · Painel de Visitas</title>
<meta name="description" content="Sistema de visitas e vendas da Mantena Solar">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f97316'/><circle cx='50' cy='38' r='14' fill='white'/><path d='M14 78l13-22h46l13 22z' fill='white' opacity='.75'/></svg>">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(160deg,#0f172a 0%,#1e293b 55%,#0f172a 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;color:#fff;
}
body::before{
  content:'';position:fixed;top:-140px;right:-120px;width:380px;height:380px;
  background:radial-gradient(circle,rgba(249,115,22,.35),transparent 70%);
  filter:blur(24px);pointer-events:none;
}
.card{
  position:relative;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:24px;padding:38px 30px;width:100%;max-width:380px;text-align:center;
  backdrop-filter:blur(10px);box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
}
.logo{
  width:66px;height:66px;border-radius:20px;margin:0 auto 20px;
  background:linear-gradient(135deg,#f97316,#f59e0b);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 30px -8px rgba(249,115,22,.65);
}
h1{font-size:22px;font-weight:800;letter-spacing:-.7px;line-height:1.2}
p.sub{font-size:13.5px;color:#94a3b8;margin-top:8px;line-height:1.55}
.spin{
  width:34px;height:34px;border:3px solid rgba(255,255,255,.15);
  border-top-color:#f97316;border-radius:50%;
  animation:g .75s linear infinite;margin:26px auto 16px;
}
@keyframes g{to{transform:rotate(360deg)}}
.status{font-size:12.5px;color:#64748b;min-height:18px}
.btn{
  display:inline-block;margin-top:20px;padding:15px 30px;border-radius:13px;
  background:linear-gradient(135deg,#f97316,#fb923c);color:#fff;text-decoration:none;
  font-size:15px;font-weight:800;box-shadow:0 10px 24px -8px rgba(249,115,22,.7);
}
.btn:active{transform:scale(.98)}
.rodape{margin-top:26px;font-size:10.5px;color:#475569;letter-spacing:.3px}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="3.2" fill="#fff"/>
      <path d="M12 1.5v1.6M12 12.9v1.6M5.5 8H3.9M20.1 8h-1.6M7.4 3.4L6.3 2.3M17.7 13.7l-1.1-1.1M7.4 12.6l-1.1 1.1M17.7 2.3l-1.1 1.1"
            stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M3 21l1.6-5.3h14.8L21 21H3z" fill="#fff" opacity=".55"/>
    </svg>
  </div>

  <h1>Mantena Solar</h1>
  <p class="sub">Painel de Visitas e Vendas</p>

  <div class="spin" id="spin"></div>
  <div class="status" id="status">Abrindo o sistema...</div>

  <a class="btn" id="btn" href="#" style="display:none">Abrir o painel</a>

  <div class="rodape">MANTENA SOLAR · ENERGIA SOLAR</div>
</div>

<script>
var APP = "https://script.google.com/macros/s/AKfycby7KSHVW_FCbqXkPZshOYkJD6DRyZ23nSw8PUOvL3MdH2W9Q2VyHq1es0-rvqFP1sav/exec";

var extra = location.search || "";

function abrir() {
  var destino = APP + extra;
  document.getElementById('status').textContent = "Redirecionando...";
  location.replace(destino);
}

document.getElementById('btn').href = APP + extra;

setTimeout(abrir, 400);

setTimeout(function () {
  document.getElementById('spin').style.display = 'none';
  document.getElementById('status').textContent = "Não abriu automaticamente?";
  document.getElementById('btn').style.display = 'inline-block';
}, 3000);
</script>

</body>
</html>
